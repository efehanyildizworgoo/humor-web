services:
  postgres:
    image: postgres:16-alpine
    container_name: humor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: humor
      POSTGRES_PASSWORD: humor
      POSTGRES_DB: humor
    ports:
      - "5432:5432"
    volumes:
      - humor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humor -d humor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  humor_pgdata:
